name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The knot laboratory, the theory page, the assumptions and the published record
        run: python -m unittest tests.test_knotlab tests.test_theory tests.test_assumptions tests.test_records tests.test_curation
